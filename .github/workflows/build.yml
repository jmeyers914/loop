name: Build Loop deck

on:
  workflow_dispatch:          # the "Run workflow" button
  schedule:
    - cron: "23 8 * * *"      # every night, ~3-4am New York time
  push:
    branches: [main]
    paths: ["builder/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: loop-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/requirements.txt

      - run: pip install -r builder/requirements.txt

      - name: Build deck from the Google Sheet
        env:
          LOOP_SHEET_URL: ${{ vars.LOOP_SHEET_URL }}
          LOOP_OUT: site
        run: |
          mkdir -p site
          cp -r img site/ 2>/dev/null || true
          python builder/build.py

      - name: Save photos back to the repo
        run: |
          rm -rf img && cp -r site/img img
          git config user.name "loop-bot"
          git config user.email "loop-bot@users.noreply.github.com"
          git add -A -- img builder/build_report.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update deck photos"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
