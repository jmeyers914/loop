name: Photo check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python builder/tools/photo_check.py builder/tools/photo_candidates.txt sheet.jpg
      - uses: actions/upload-artifact@v4
        with: { name: sheet, path: sheet.jpg }
